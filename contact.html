
<!DOCTYPE html>
<html lang="en">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&family=Open+Sans&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <title>Contact Us - My Restaurant</title>
  <link rel="stylesheet" href="contact.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <!--Nav Bar section -->>
  <header>
    <h1>Contact Us</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="menu.html">Menu</a></li>
        <li><a href="reserve.html">Reserve</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>
<!--Contact section-->
  <main class="contact-page">
    <div class="contact-container">
      <section class="contact-form">
        <h2>Get in Touch</h2>
        <form action="#" method="post">
          <input type="text" name="name" placeholder="Your Name" required>
          <input type="email" name="email" placeholder="Your Email" required>
          <textarea name="message" rows="5" placeholder="Your Message" required></textarea>
          <button type="submit">Send Message</button>
        </form>
      </section>

      <section class="contact-info">
        <h3>Our Info</h3>
        <p><i class="fas fa-map-marker-alt"></i> 123 Foodie Lane, Flavor Town</p>
        <p><i class="fas fa-phone"></i> (123) 456-7890</p>
        <p><i class="fas fa-clock"></i> Open Daily: 11am - 10pm</p>
      </section>
    </div>
  </main>

  <div class="contact-map">
      <iframe src="https://maps.google.com/maps?q=123%20Foodie%20Lane&t=&z=13&ie=UTF8&iwloc=&output=embed" width="100%" height="300" style="border:0;" allowfullscreen></iframe>
    </div>
  </main>
<!--Footer section -->
  <footer>
    <p>&copy; 2025 My Restaurant | Designed with love & flavor.</p>
    <div class="social-links">
      <a href="https://www.instagram.com" target="_blank" class="btn social-btn">
        <i class="fab fa-instagram"></i> Instagram
      </a>
      <a href="https://www.facebook.com" target="_blank" class="btn social-btn">
        <i class="fab fa-facebook"></i> Facebook
      </a>
      <a href="https://www.twitter.com" target="_blank" class="btn social-btn">
        <i class="fab fa-twitter"></i> Twitter
      </a>
    </div>
  </footer>

</body>
</html>
